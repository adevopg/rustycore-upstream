[package]
name = "wow-client-downloader"
description = "Command-line WoW Classic 3.4.3.54261 client downloader (Blizzard CDN with archive mirror fallback) with a temporary local versions/cdns/CDN server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "wow-client-downloader"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
wow-casc = { path = "../../crates/wow-casc" }
flate2 = "1.1"
md-5 = "0.10"
tiny_http = "0.12"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.25"

[lints]
workspace = true
