// BNet presence types.
//
// Reconstructed from the FileDescriptorProto embedded in TrinityCore 3.4.3
// `src/server/proto/Client/presence_types.pb.cc` (`protoc --decode`). The generated
// file also registers `extend bgs.protocol.channel.v1.ChannelState { optional
// ChannelState presence = 101; }`; nothing in RustyCore carries a channel
// ChannelState, so that extension (and the channel_types import) is dropped.

syntax = "proto2";
package bgs.protocol.presence.v1;

import "bgs/low/pb/client/attribute_types.proto";
import "bgs/low/pb/client/entity_types.proto";

message RichPresenceLocalizationKey {
  required fixed32 program = 1;
  required fixed32 stream = 2;
  required uint32 localization_id = 3;
}

message FieldKey {
  required uint32 program = 1;
  required uint32 group = 2;
  required uint32 field = 3;
  optional uint64 unique_id = 4;
}

message Field {
  required FieldKey key = 1;
  required bgs.protocol.Variant value = 2;
}

message FieldOperation {
  enum OperationType {
    SET = 0;
    CLEAR = 1;
  }
  required Field field = 1;
  optional OperationType operation = 2 [default = SET];
}

message PresenceState {
  optional bgs.protocol.EntityId entity_id = 1;
  repeated FieldOperation field_operation = 2;
}

message ChannelState {
  optional bgs.protocol.EntityId entity_id = 1;
  repeated FieldOperation field_operation = 2;
  optional bool healing = 3;
}
